name: Bootstrap youtube-speed-studio 1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/seg.* > /tmp/source.b64
          echo '860c2f32dd9c19f37369301738d2cefd912f31c8e27bfd3e8baf22194bf8b9c1  /tmp/source.b64' | sha256sum -c -
          base64 -d /tmp/source.b64 > /tmp/source.tar.xz
          echo '51d6edc6e11eb75ac31bc922079d107e9355d528a0d16fa54e37aaa54beb35d3  /tmp/source.tar.xz' | sha256sum -c -
          rm -rf /tmp/source
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/source')
          manifest = json.loads((root / 'manifest.json').read_text())
          integrity = json.loads((root / 'integrity.json').read_text())
          assert manifest['name'] == 'youtube-speed-studio'
          assert manifest['version'] == '1.0.0'
          assert integrity['fingerprint'] == '86677a72a82e0064c01dd2fcc0756eb01329f5a231c0047eef732afa57438f71'
          assert sum(1 for p in root.rglob('*') if p.is_file()) == 29
          print('SOURCE_GATE_PASS')
          PY
      - name: Publish verified source to main
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/source/ ./
          python scripts/generate_integrity.py .
          git diff --exit-code -- integrity.json
          python -m json.tool manifest.json >/dev/null
          for f in *.js; do node --check "$f" >/dev/null; done
          git config user.name 'Ray20123315'
          git config user.email '150588882+Ray20123315@users.noreply.github.com'
          git add -A
          git commit -m 'Release youtube-speed-studio 1.0.0'
          git push origin HEAD:main
