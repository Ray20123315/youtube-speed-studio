name: Verify v1.0.0 release assets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify official release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ytss-release && mkdir -p /tmp/ytss-release
          gh release view v1.0.0 --json tagName,targetCommitish,url,isDraft,isPrerelease,publishedAt,assets > /tmp/ytss-release/meta.json
          gh release download v1.0.0 -p 'youtube-speed-studio_1.0.0.zip' -p 'youtube-speed-studio_1.0.0.zip.sha256' -D /tmp/ytss-release
          cd /tmp/ytss-release
          sha256sum -c youtube-speed-studio_1.0.0.zip.sha256
          unzip -t youtube-speed-studio_1.0.0.zip >/dev/null
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          d=Path('/tmp/ytss-release')
          meta=json.loads((d/'meta.json').read_text())
          names=sorted(a['name'] for a in meta.get('assets',[]))
          required={'youtube-speed-studio_1.0.0.zip','youtube-speed-studio_1.0.0.zip.sha256'}
          assert meta['tagName']=='v1.0.0'
          assert not meta['isDraft'] and not meta['isPrerelease']
          assert required <= set(names)
          z=d/'youtube-speed-studio_1.0.0.zip'
          with zipfile.ZipFile(z) as f:
              files=sorted(x.filename for x in f.infolist() if not x.is_dir())
              manifest=json.loads(f.read('manifest.json'))
              integ=json.loads(f.read('integrity.json'))
          assert manifest['name']=='youtube-speed-studio' and manifest['version']=='1.0.0'
          assert integ['fingerprint']=='86677a72a82e0064c01dd2fcc0756eb01329f5a231c0047eef732afa57438f71'
          print('RELEASE_VERIFY_PASS')
          print('TAG',meta['tagName'])
          print('TARGET',meta['targetCommitish'])
          print('URL',meta['url'])
          print('PUBLISHED',meta['publishedAt'])
          print('ASSETS',','.join(names))
          print('ZIP_SHA256',hashlib.sha256(z.read_bytes()).hexdigest())
          print('ZIP_FILES',len(files))
          print('FINGERPRINT',integ['fingerprint'])
          PY
