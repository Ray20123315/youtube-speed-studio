name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify signed anti-tamper manifest
        run: |
          python -m json.tool manifest.json >/dev/null
          python -m json.tool integrity-lock.json >/dev/null
          python scripts/verify_signed_integrity.py
      - name: Build release package
        run: python scripts/build_release.py
      - name: Create official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c 'import json;print(json.load(open("manifest.json"))["version"])')"
          TAG="v${VERSION}"
          ASSET="dist/youtube-speed-studio_${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists; keeping immutable published release."
            exit 0
          fi
          gh release create "$TAG" \
            "$ASSET" \
            "$ASSET.sha256" \
            --target "$GITHUB_SHA" \
            --title "youtube-speed-studio ${VERSION}" \
            --notes-file RELEASE_NOTES.md
